name: CI

on:
  push:
    branches: [main, release-cleanup]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NSCR-NQueens.sln

      - name: Build
        run: dotnet build NSCR-NQueens.sln --configuration Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project tests/NSCR.NQueens.SmokeTests --configuration Release --no-build
